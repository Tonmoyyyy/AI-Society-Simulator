<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace — AI Society Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../static/css/custom.css" />
</head>
<body>

<div id="asim-nav"></div>

<main class="container-fluid px-3 px-md-4 py-4" style="max-width: 1200px;">

  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
    <div>
      <h1 class="h3 mb-1">Marketplace</h1>
      <p class="text-ink-soft mb-0">Where citizens spend what they earn — see <a href="dashboard.html">dashboard</a> for total money in the economy.</p>
    </div>
    <button id="new-shop-btn" class="btn btn-outline-asim">+ New shop</button>
  </div>

  <div id="shops-feedback" class="mb-3"></div>

  <div class="row g-3" id="shops-grid">
    <div class="col-12 text-ink-faint">Loading shops…</div>
  </div>

</main>

<!-- New shop modal -->
<div class="modal fade" id="new-shop-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title font-display">New shop</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="new-shop-form">
        <div class="modal-body">
          <div id="new-shop-error" class="alert-asim-error mb-3 d-none"></div>
          <div class="mb-3">
            <label class="form-label small text-ink-soft">Shop name</label>
            <input type="text" class="form-control" id="new-shop-name" required maxlength="100" />
          </div>
          <div class="mb-2">
            <label class="form-label small text-ink-soft">Category</label>
            <input type="text" class="form-control" id="new-shop-category" required maxlength="50" placeholder="e.g. grocery, electronics" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-asim" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-asim-primary">Create shop</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Add product modal -->
<div class="modal fade" id="new-product-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title font-display">Add product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="new-product-form">
        <div class="modal-body">
          <div id="new-product-error" class="alert-asim-error mb-3 d-none"></div>
          <input type="hidden" id="new-product-shop-id" />
          <p class="text-ink-soft small mb-3">Adding to: <strong id="new-product-shop-name"></strong></p>
          <div class="mb-3">
            <label class="form-label small text-ink-soft">Product name</label>
            <input type="text" class="form-control" id="new-product-name" required maxlength="100" />
          </div>
          <div class="mb-2">
            <label class="form-label small text-ink-soft">Price ($)</label>
            <input type="number" class="form-control" id="new-product-price" required min="0.01" step="0.01" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-asim" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-asim-primary">Add product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/avatar.js"></script>
<script src="../static/js/api/client.js"></script>
<script src="../static/js/api/auth.js"></script>
<script src="../static/js/api/shop.js"></script>
<script src="../static/js/websocket.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/pages/shops.js"></script>
</body>
</html>
