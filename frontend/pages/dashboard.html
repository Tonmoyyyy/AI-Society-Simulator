<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — AI Society Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../static/css/custom.css" />
</head>
<body>

<div id="asim-nav"></div>

<main class="container-fluid px-3 px-md-4 py-4" style="max-width: 1200px;">

  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
    <div>
      <h1 class="h3 mb-1">Population dashboard</h1>
      <p class="text-ink-soft mb-0">A live read of the civilization, updated whenever a tick runs.</p>
    </div>
    <div class="d-flex gap-2">
      <button id="trigger-tick-btn" class="btn btn-asim-amber">Run one tick</button>
    </div>
  </div>

  <div id="tick-feedback" class="mb-3"></div>

  <!-- Stat cards -->
  <div class="row g-3 mb-4" id="stat-cards">
    <div class="col-6 col-md-3">
      <div class="asim-card stat-card">
        <div class="stat-label">Population</div>
        <div class="stat-value" id="stat-population">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="asim-card stat-card">
        <div class="stat-label">Employed</div>
        <div class="stat-value" id="stat-employed">—</div>
        <div class="stat-sub" id="stat-unemployed-sub">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="asim-card stat-card">
        <div class="stat-label">Money in economy</div>
        <div class="stat-value" id="stat-money">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="asim-card stat-card">
        <div class="stat-label">Richest citizen</div>
        <div class="stat-value" id="stat-richest" style="font-size:1.3rem;">—</div>
        <div class="stat-sub" id="stat-richest-sub">—</div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <!-- Wellbeing chart -->
    <div class="col-lg-5">
      <div class="asim-card h-100">
        <h2 class="h6 mb-3">Average wellbeing</h2>
        <canvas id="wellbeing-chart" height="200"></canvas>
      </div>
    </div>

    <!-- Trending posts -->
    <div class="col-lg-4">
      <div class="asim-card h-100">
        <h2 class="h6 mb-3">Trending posts</h2>
        <div id="trending-list">
          <div class="text-ink-faint small">Loading…</div>
        </div>
      </div>
    </div>

    <!-- Recent timeline -->
    <div class="col-lg-3">
      <div class="asim-card h-100">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h6 mb-0">Recent history</h2>
          <a href="timeline.html" class="small">View all</a>
        </div>
        <div id="recent-timeline">
          <div class="text-ink-faint small">Loading…</div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/avatar.js"></script>
<script src="../static/js/api/client.js"></script>
<script src="../static/js/api/auth.js"></script>
<script src="../static/js/api/dashboard.js"></script>
<script src="../static/js/websocket.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/pages/dashboard.js"></script>
</body>
</html>
