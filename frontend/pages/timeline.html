<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timeline — AI Society Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../static/css/custom.css" />
</head>
<body>

<div id="asim-nav"></div>

<main class="container px-3 px-md-4 py-4" style="max-width: 720px;">

  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
    <div>
      <h1 class="h3 mb-1">Timeline</h1>
      <p class="text-ink-soft mb-0">How this civilization has evolved, tick by tick.</p>
    </div>
    <select id="category-filter" class="form-select form-select-sm" style="width:auto;">
      <option value="">All events</option>
      <option value="population">Population</option>
      <option value="richest_citizen">Wealth</option>
      <option value="happiness">Happiness</option>
    </select>
  </div>

  <div class="asim-card">
    <div id="timeline-list">
      <div class="text-ink-faint small">Loading…</div>
    </div>
  </div>

  <div class="text-center mt-3">
    <button id="load-more-btn" class="btn btn-sm btn-outline-asim d-none">Load more</button>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/api/client.js"></script>
<script src="../static/js/api/auth.js"></script>
<script src="../static/js/api/dashboard.js"></script>
<script src="../static/js/websocket.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/pages/timeline.js"></script>
</body>
</html>
