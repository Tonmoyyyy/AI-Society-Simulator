<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Presidency — AI Society Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../static/css/custom.css" />
</head>
<body>

<!--
  THE PRESIDENCY — the admin's government console.

  Everything on this page is filled in by JavaScript from the backend. No name,
  no city, no office title and no seat count is written in this file, for the same
  reason the 3D map hardcodes nothing: renaming the President to "Alex" has to
  change what this page says without anyone editing HTML.

  The picker at the bottom is a DIRECT appointment list, not a ballot. There is no
  nomination stage and no vote — the admin observes and operates the society rather
  than voting in it. GET /api/v1/government/candidates is the seam an election
  would plug into later (§21) without changing what "eligible" means.
-->

<div id="asim-nav"></div>

<main class="container-fluid px-3 px-md-4 py-4" style="max-width: 1200px;">

  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
    <div>
      <h1 class="h3 mb-1">The Presidency</h1>
      <p class="text-ink-soft mb-0" id="gov-subtitle">Loading the government…</p>
    </div>
    <div class="d-flex gap-2">
      <button id="auto-appoint-btn" class="btn btn-outline-asim" title="Fill any office that is currently vacant. Filled offices are left alone.">Auto-fill vacancies</button>
      <a href="world.html" class="btn btn-asim-amber">View on the map</a>
    </div>
  </div>

  <div id="gov-feedback" class="mb-3"></div>

  <!-- ---------------------------------------------------------------- offices -->
  <div class="row g-3 mb-4" id="office-cards">
    <div class="col-12 col-lg-6">
      <div class="asim-card h-100" id="office-president">
        <div class="text-ink-faint small text-uppercase mb-3" style="letter-spacing:0.09em; font-weight:600;">President</div>
        <div class="d-flex align-items-center gap-3" id="president-body">
          <div class="text-ink-faint small">Loading…</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="asim-card h-100" id="office-first-lady">
        <div class="text-ink-faint small text-uppercase mb-3" style="letter-spacing:0.09em; font-weight:600;">First Lady</div>
        <div class="d-flex align-items-center gap-3" id="first-lady-body">
          <div class="text-ink-faint small">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- --------------------------------------------------------------- policy -->
  <div class="asim-card mb-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h2 class="h6 mb-0 font-display">National policy</h2>
      <span class="text-ink-faint small" id="policy-hint">Applies from the next tick</span>
    </div>
    <form id="policy-form" class="row g-3 align-items-end">
      <div class="col-12 col-sm-4">
        <label class="form-label small text-ink-soft" for="policy-tax">Tax rate (%)</label>
        <input type="number" class="form-control" id="policy-tax" min="0" max="100" step="0.5" />
      </div>
      <div class="col-12 col-sm-4">
        <div class="form-check mt-sm-4">
          <input class="form-check-input" type="checkbox" id="policy-curfew" />
          <label class="form-check-label small" for="policy-curfew">Curfew in effect</label>
        </div>
      </div>
      <div class="col-12 col-sm-4">
        <button type="submit" class="btn btn-asim-primary w-100">Save policy</button>
      </div>
    </form>
  </div>

  <!-- ----------------------------------------------------------- parliament -->
  <div class="asim-card mb-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h2 class="h6 mb-0 font-display">Parliament</h2>
      <span class="text-ink-faint small" id="parliament-count">—</span>
    </div>
    <div id="parliament-list">
      <div class="text-ink-faint small">Loading the chamber…</div>
    </div>
  </div>

  <!-- ------------------------------------------------------------ candidates -->
  <div class="asim-card">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-3">
      <div>
        <h2 class="h6 mb-1 font-display">Candidates</h2>
        <p class="text-ink-faint small mb-0" id="candidate-note">Loading…</p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <input type="search" class="form-control form-control-sm" id="candidate-search" placeholder="Search name or national ID" style="min-width: 210px;" />
        <select class="form-select form-select-sm" id="candidate-gender" style="min-width: 130px;">
          <option value="">Any gender</option>
        </select>
      </div>
    </div>

    <div id="candidate-list">
      <div class="text-ink-faint small">Loading candidates…</div>
    </div>
  </div>

</main>

<!-- Seat a citizen in parliament. Opened from a candidate row, so the citizen is
     already chosen by the time this appears — the modal only asks for the party,
     which is the one thing the picker can't infer. -->
<div class="modal fade" id="seat-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title font-display">Seat in parliament</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="seat-error" class="alert-asim-error mb-3 d-none"></div>
        <p class="text-ink-soft small mb-3" id="seat-who">—</p>
        <form id="seat-form">
          <div class="mb-3">
            <label class="form-label small text-ink-soft" for="seat-party">Party (optional)</label>
            <input type="text" class="form-control" id="seat-party" maxlength="60" placeholder="Independent if blank" />
          </div>
          <div class="mb-3">
            <label class="form-label small text-ink-soft" for="seat-number">Seat number (optional)</label>
            <input type="number" class="form-control" id="seat-number" min="1" placeholder="Lowest free seat" />
          </div>
          <button type="submit" class="btn btn-asim-primary w-100">Seat them</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/config.js"></script>
<script src="../static/js/avatar.js"></script>
<script src="../static/js/api/client.js"></script>
<script src="../static/js/api/auth.js"></script>
<script src="../static/js/api/citizens.js"></script>
<script src="../static/js/api/government.js"></script>
<script src="../static/js/websocket.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/pages/president.js"></script>
</body>
</html>
