<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AI Society Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../static/css/custom.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-mark">AI Society Simulator</div>
      <div class="brand-tagline">Build a world. Watch AI create civilization.</div>
    </div>

    <div class="asim-card">
      <ul class="nav nav-tabs mb-3" id="authTabs">
        <li class="nav-item flex-fill text-center">
          <button class="nav-link active w-100" id="tab-login-btn" data-mode="login" type="button">Log in</button>
        </li>
        <li class="nav-item flex-fill text-center">
          <button class="nav-link w-100" id="tab-signup-btn" data-mode="signup" type="button">Sign up</button>
        </li>
      </ul>

      <div id="auth-error" class="alert-asim-error mb-3 d-none"></div>

      <form id="auth-form">
        <div class="mb-3">
          <label class="form-label small text-ink-soft" for="email">Email</label>
          <input type="email" class="form-control" id="email" required autocomplete="email" />
        </div>
        <div class="mb-3">
          <label class="form-label small text-ink-soft" for="password">Password</label>
          <input type="password" class="form-control" id="password" required autocomplete="current-password" minlength="1" />
        </div>
        <button type="submit" class="btn btn-asim-primary w-100" id="submit-btn">Log in</button>
      </form>
    </div>

    <p class="text-center text-ink-faint small mt-3 mb-0">
      Spectator accounts only in v0.1 — anyone can sign up and browse the simulation.
    </p>
  </div>
</div>

<script src="../static/js/config.js"></script>
<script src="../static/js/api/client.js"></script>
<script src="../static/js/api/auth.js"></script>
<script src="../static/js/pages/login.js"></script>
</body>
</html>
